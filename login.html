<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viper Royale - Acceso y Registro</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🐍 VIPER ROYALE</h1>
            <p id="formTitle">Accede a tu cuenta para jugar</p>
        </div>

        <div id="authMessage" class="auth-message"></div>
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="loginForm">
            <div class="input-group">
                <label for="loginEmail">Correo Electrónico</label>
                <input type="email" id="loginEmail" required placeholder="tucorreo@email.com">
            </div>
            <div class="input-group">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn primary">Iniciar Sesión</button>
            <div class="form-footer">
                <a href="#" id="linkResetPassword">¿Olvidaste tu contraseña?</a>
                <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
            </div>
        </form>

        <!-- FORMULARIO DE REGISTRO COMPLETO -->
        <form id="registerForm" style="display: none;">
            <div class="input-group">
                <label for="regUsername">Nombre de Usuario (Único)</label>
                <input type="text" id="regUsername" required placeholder="Ej: GamerPro_01">
            </div>
            <div class="input-group">
                <label for="regEmail">Correo Electrónico</label>
                <input type="email" id="regEmail" required placeholder="tucorreo@email.com">
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="regIdCard">Cédula</label>
                    <input type="text" id="regIdCard" required placeholder="V-12345678">
                </div>
                <div class="input-group">
                    <label for="regBankCode">Código de Banco</label>
                    <input type="text" id="regBankCode" required placeholder="Ej: 0102">
                </div>
            </div>
            <div class="input-group">
                <label for="regPhone">Número de Teléfono</label>
                <input type="tel" id="regPhone" required placeholder="04121234567">
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" required placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label for="regConfirmPassword">Repetir Contraseña</label>
                    <input type="password" id="regConfirmPassword" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn primary">Crear Cuenta</button>
            <div class="form-footer">
                <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia Sesión</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>

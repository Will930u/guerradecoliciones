<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viper Royale - Acceso de Jugador</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🐍 VIPER ROYALE</h1>
            <p>Accede para sincronizar tu billetera y realizar recargas</p>
        </div>

        <div id="authMessage" class="auth-message"></div>

        <form id="authForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tucorreo@email.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="button-group">
                <button type="submit" id="btnLogin" class="btn primary">Iniciar Sesión</button>
                <button type="button" id="btnSignup" class="btn secondary">Registrarse</button>
            </div>
        </form>
    </div>

    <!-- Supabase CDN v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>

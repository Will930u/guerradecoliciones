<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of the Coalitions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .btn-danger {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border: 1px solid #dc2626 !important;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-card">
            <div>Saldo: <span id="userBalance" class="balance-val">$0.00 USD</span></div>
            <div class="bcv-val">Tasa BCV: <span id="bcvRate">--</span> VES</div>
        </div>
        <div class="hud-card">
            <button class="btn-action" onclick="openModal()">💳 Recargar ($2)</button>
            <button class="btn-action btn-gold" onclick="alert('Tienda de Bots')">🤖 Tienda Bot</button>
            <button class="btn-action btn-danger" onclick="window.exitGame && window.exitGame()">🚪 Salir</button>
        </div>
    </div>

    <div id="cashOutHUD">
        <span style="font-size: 0.85rem; font-weight: bold; color: #eab308;">Cash Out</span>
        <div class="cash-bar-container">
            <div class="cash-bar-fill" id="cashBarFill"></div>
        </div>
        <button class="btn-cashout" id="cashOutBtn" onclick="attemptCashOut()" disabled style="opacity: 0.5; cursor: not-allowed; background: #64748b; color: #fff; border: none; padding: 4px 12px;">Retiro</button>
    </div>

    <div id="skinGallery">
        <div class="gallery-title">Skins y Estilos</div>
        <div class="skin-grid">
            <div class="skin-card" onclick="selectSkin('cyber_dragon')">
                <div style="font-size: 24px;">🐉</div>
                <label>Digital Dragon</label>
            </div>
            <div class="skin-card" onclick="selectSkin('fire_scale')">
                <div style="font-size: 24px;">🔥</div>
                <label>FireScale</label>
            </div>
            <div class="skin-card" onclick="selectSkin('flag_venezuela')">
                <div style="font-size: 24px;">🇻🇪</div>
                <label>TriColor</label>
            </div>
            <div class="skin-card" onclick="selectSkin('clockwork_gator')">
                <div style="font-size: 24px;">🐊</div>
                <label>Gator</label>
            </div>
        </div>
    </div>

    <div id="floatingNotification" style="position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.95); color: #fff; padding: 10px 24px; border-radius: 999px; box-shadow: 0 8px 22px rgba(0,0,0,0.25); display: block; opacity: 1; z-index: 2000; font-weight: bold;">
        Aviso del juego
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="modal-overlay" id="depositModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modalTitle">Recargar Entrada ($2.00)</span>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <p>Costo de entrada a la partida: <strong>$2.00 USD</strong></p>
                <div class="payment-info">
                    • Banco: Banesco (0134)<br>
                    • Teléfono: 0412-1234567<br>
                    • C.I.: V-12.345.678
                </div>
                <div style="margin-top: 15px;">
                    <label style="font-size: 0.85rem; color: #94a3b8;">Número de Referencia:</label>
                    <input type="text" id="refInput" class="form-control" placeholder="Ej: 123456">
                </div>
                <button class="btn-action" style="width: 100%; padding: 12px; margin-top: 15px;" onclick="submitPayment()">Enviar Comprobante</button>
            </div>
        </div>
    </div>

    <script>
        window.exitGame = function exitGame() {
            const isInGame = typeof isGameActive !== 'undefined' ? Boolean(isGameActive) : false;
            if (isInGame) {
                const confirmExit = confirm("⚠️ ¡Estás en plena partida! Si sales ahora, perderás la inversión de tu entrada actual ($2.00 USD). ¿Deseas salir?");
                if (!confirmExit) return;
                if (typeof window.forfeitMatch === 'function') {
                    window.forfeitMatch();
                }
            }
            window.location.href = 'login.html';
        };
    </script>

    <script src="game.js"></script>
    <script src="creature-species.js"></script>
</body>
</html>

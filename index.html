<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viper Royale - Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HUD Superior / Marcadores -->
    <div id="hud">
        <div class="hud-card">
            <div>Saldo: <span id="userBalance" class="balance-val">$0.00 USD</span></div>
            <div class="bcv-val">Tasa BCV: <span id="bcvRate">--</span> VES</div>
        </div>
        <div class="hud-card">
            <button class="btn-action" onclick="openModal()">💳 Recargar ($2)</button>
            <button class="btn-action btn-gold" onclick="alert('Tienda de Bots')">🤖 Tienda Bot</button>
        </div>
    </div>

    <!-- Barra Superior de Cash Out Dinámico -->
    <div id="cashOutHUD">
        <span style="font-size: 0.85rem; font-weight: bold; color: #eab308;">Cash Out</span>
        <div class="cash-bar-container">
            <div class="cash-bar-fill" id="cashBarFill"></div>
        </div>
        <button class="btn-cashout" onclick="attemptCashOut()">Retirar</button>
    </div>

    <!-- Panel Lateral de Selección de Skins (Galería) -->
    <div id="skinGallery">
        <div class="gallery-title">Skins y Estilos</div>
        <div class="skin-grid">
            <div class="skin-card" onclick="selectSkin('cyber_dragon')">
                <div style="font-size: 24px;">🐉</div>
                <label>Digital Dragon</label>
            </div>
            <div class="skin-card" onclick="selectSkin('fire_scale')">
                <div style="font-size: 24px;">🔥</div>
                <label>FireScale</label>
            </div>
            <div class="skin-card" onclick="selectSkin('flag_venezuela')">
                <div style="font-size: 24px;">🇻🇪</div>
                <label>TriColor</label>
            </div>
            <div class="skin-card" onclick="selectSkin('clockwork_gator')">
                <div style="font-size: 24px;">🐊</div>
                <label>Gator</label>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN FLOTANTE (Aparece y desaparece sin pausar el juego) -->
    <div id="floatingNotification" style="position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.95); color: #fff; padding: 10px 24px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; z-index: 99; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center;">
        Aviso del juego
    </div>

    <!-- Canvas de la Arena de Juego -->
    <canvas id="gameCanvas"></canvas>

    <!-- Ventana Flotante / Modal de Pago Móvil -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>Recargar Entrada ($2.00)</span>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Costo de entrada a la partida: <strong>$2.00 USD</strong></p>
                <div class="payment-info">
                    • Banco: Banesco (0134)<br>
                    • Teléfono: 0412-1234567<br>
                    • C.I.: V-12.345.678
                </div>
                <div style="margin-top: 15px;">
                    <label style="font-size: 0.85rem; color: #94a3b8;">Número de Referencia:</label>
                    <input type="text" id="refInput" class="form-control" placeholder="Ej: 123456">
                </div>
            </div>
            <button class="btn-action" style="width: 100%; padding: 12px; margin: 0;" onclick="submitPayment()">Enviar Comprobante</button>
        </div>
    </div>

    <!-- Script principal del juego -->
    <script src="game.js"></script>
</body>
</html>
